name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  search-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:p0-canonical
      - run: npm run test:category-reliability
      - run: npm run test:luxury-watch
      - run: npm run test:vertical-taste-grammar
      - run: npm run test:vertical-taste-shadow
      - run: npm run test:taste-pollution
      - run: npm run test:watch-taste-canary
      - run: npm run test:watch-taste-apply-parity
      - run: npm run test:fragrance-taste-canary
      - run: npm run test:fragrance-taste-apply-parity
      - run: npm run test:taste-institutional-gate
      - run: npm run test:taste-deploy-reports

  validate:
    runs-on: ubuntu-latest
    needs: search-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run env:check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
          SERPAPI_KEY: serpapi_ci_placeholder
          OPENAI_API_KEY: sk-ci_placeholder
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
          SERPAPI_KEY: serpapi_ci_placeholder
          OPENAI_API_KEY: sk-ci_placeholder
